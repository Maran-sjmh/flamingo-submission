# Independent static frontend. The existing research API remains a separate Worker.
name = "flamingo-submission-demo"
compatibility_date = "2026-11-15"
workers_dev = true
preview_urls = false
send_metrics = false

[assets]
directory = "dist"
not_found_handling = "single-page-application"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.05

[observability.traces]
enabled = true
head_sampling_rate = 0.01
