name = "flamingo-submission-api"
main = "src/entry.mjs"
compatibility_date = "2026-11-14"
workers_dev = true
preview_urls = false
send_metrics = false

[vars]
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-5.4-mini-2026-03-17"
OPENAI_REQUIRE_PROMO_SMALL_GROUP = "true"
OPENAI_PROMO_PROJECT_CONFIRMED = "false"
OPENAI_BALANCE_CONFIRMED = "false"
ENABLE_OPENAI = "false"
ENABLE_RAG_GENERATION = "false"
OPENAI_BILLING_APPROVED = "false"
ENABLE_GROQ = "false"
FREE_TIER_CONFIRMED = "false"
GROQ_MODEL = "openai/gpt-oss-20b"
ENABLE_SEMANTIC_SEARCH = "false"
REQUIRE_SEMANTIC_BUDGET = "true"
SEMANTIC_DAILY_LIMIT = "250"
RETRIEVAL_CORPUS_VERSION = "696e5da5c741deb796e6c0778c39f38dd18eedf5535f554ce7251cc2f9abdaa0"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.05

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "2281101"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "2281102"
simple = { limit = 20, period = 60 }

[ai]
binding = "AI"

[build]
command = "node scripts/build_demo.mjs"

[[vectorize]]
binding = "NASA_VECTORS"
index_name = "flamingo-research-bge-small-v1"

[[durable_objects.bindings]]
name = "SEMANTIC_BUDGET"
class_name = "EmbeddingBudget"

[[migrations]]
tag = "v1-semantic-budget"
new_sqlite_classes = ["EmbeddingBudget"]
